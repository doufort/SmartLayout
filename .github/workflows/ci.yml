name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Dictionaries, sources, release DMG (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
      - run: pip install -r requirements-dev.txt
      - run: python3 tools/check_dicts.py
      - run: python3 -m pytest

  swift:
    name: swift build + swift test + app bundle (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Build app bundle
        run: ./build_app.sh
      - name: Check the fresh bundle
        run: |
          pip3 install --break-system-packages -r requirements-dev.txt
          SMARTLAYOUT_APP=build/SmartLayout.app python3 -m pytest pytests/test_bundle.py
